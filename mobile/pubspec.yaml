name: mogok_maung_mobile
description: Mogok Maung - Myanmar football betting mobile client.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  web_socket_channel: ^2.4.0
  flutter_riverpod: ^2.5.1
  http: ^1.2.1
  flutter_bloc: ^8.1.6
  dio: ^5.4.3
  get_it: ^7.7.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  connectivity_plus: ^6.0.5
  video_player: ^2.8.3
  chewie: ^1.7.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/l10n/