# ==============================================================================
# Admin Dashboard vhost - admin.oddsmyanmar.online  (Option a: isolated subdomain)
#
# Serves the Admin Web Dashboard (Next.js SSR `next start` on :3000) at a
# dedicated subdomain, hardened by the SAME $admin_gate used for
# /api/v1/admin/* in the main vhost:
#   - Reachable ONLY from office CIDRs (admin-whitelist.conf) OR a verified
#     Cloudflare Tunnel / VPC origin that ALSO carries $http_cf_connecting_ip
#     (cloudflared-ips.conf). Everything else is rejected with 403 at the edge.
#   - Real client IP is recovered from CF-Connecting-IP (http-level already
#     does this via `include cloudflare-ips.conf` + real_ip_header; re-declared
#     here explicitly so the office IP is read correctly through Cloudflare).
#   - Proxies to upstream `admin_web` (127.0.0.1:3000) from nginx.conf.
#
# PREREQUISITES before adding to sites-enabled + reload:
#   1. DNS        : A record  admin.oddsmyanmar.online  ->  VPS public IP.
#   2. Certificate: expand existing cert-name:
#        certbot certonly --webroot -w /var/www/certbot \
#          -d oddsmyanmar.online -d api.oddsmyanmar.online -d admin.oddsmyanmar.online
#      (cert-name stays `oddsmyanmar.online` so the ssl paths below are unchanged)
#   3. Runtime    : dashboard on 127.0.0.1:3000 (admin-web container, healthy).
# ==============================================================================

# --- HTTP : ACME challenge + redirect -----------------------------------------
server {
    listen 80;
    server_name admin.oddsmyanmar.online;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS : gated dashboard ----------------------------------------------------
server {
    listen 443 ssl http2;
    server_name admin.oddsmyanmar.online;

    # Real client IP read correctly through Cloudflare (official ranges file).
    include /etc/nginx/cloudflare-ips.conf;
    real_ip_header CF-Connecting-IP;

    ssl_certificate     /etc/letsencrypt/live/oddsmyanmar.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/oddsmyanmar.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    client_max_body_size 4m;

    # IP blocking - the whole dashboard is OFF unless the client passes the
    # admin-plane gate (office CIDR in admin-whitelist.conf, or a verified
    # cloudflared/VPC origin carrying a real CF-Connecting-IP header).
    if ($admin_gate = 0) { return 403; }

    # Dashboard runtime - proxy to the Next.js app on :3000.
    location / {
        limit_req zone=api_zone burst=200;
        proxy_pass http://admin_web;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_set_header Upgrade            $http_upgrade;
        proxy_set_header Connection         $connection_upgrade;
        proxy_cache_bypass                  $http_upgrade;
    }
}