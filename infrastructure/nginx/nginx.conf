# ==============================================================================
# Mogok Maung — Edge / API Gateway (Nginx)
#
# Production edge rules (Phase 4 guardrails):
#   1. Rate-limit authentication endpoints (/api/v1/auth/*) so credential
#      stuffing / brute force cannot hit the API directly.
#   2. /api/v1/admin/* and /api/v1/agent/* reachable ONLY from:
#        a. office-IP CIDRs in admin-whitelist.conf, OR
#        b. a verified origin (cloudflared tunnel daemon / internal VPC CIDR
#           in cloudflared-ips.conf) that also carries $http_cf_connecting_ip
#           (i.e. a request that really came in through a Cloudflare Tunnel).
#   3. HTTPS + WSS enforced; security headers set; body sizes capped.
#
# REQUIRED before use (search for the tokens below):
#   - Replace  <BACKEND_UPSTREAM>              with the ALB DNS / container DNS
#   - Replace  <CF_ZONE_TOKEN>                 with your Cloudflare token (--tok
#   - cloudflare-ips.conf ships real Cloudflare ranges (see
#     https://www.cloudflare.com/ips-v4 and /ips-v6) and is REQUIRED so the
#     real_ip rewrite below cannot be spoofed by arbitrary clients.
#   - Fill OFFICE_IP_ALLOWLIST / admin-whitelist.conf with HQ/agent-office CIDRs.
#   - Fill cloudflared-ips.conf with the cloudflared origin IP / internal VPC
#     CIDR of the machine facing the Tunnel (used by the admin gate branch b).
# ==============================================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events { worker_connections 4096; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;
    server_tokens off;

    # --- Real client IP when behind Cloudflare ------------------------------
    # cloudflare-ips.conf (set_real_ip_from per official range) makes nginx
    # trust CF-Connecting-IP ONLY from Cloudflare edges, so $remote_addr
    # becomes the true client behind both classic proxy and Tunnel ingress.
    include /etc/nginx/cloudflare-ips.conf;
    real_ip_header CF-Connecting-IP;

    # --- Rate limiting -------------------------------------------------------
    # Zone: 10m state (~160k keys), shared across workers. Auth endpoints are
    # limited to 10 req/min per client; the rest of the API is lightly limited.
    limit_req_zone $binary_remote_addr zone=auth_zone:10m   rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api_zone:10m    rate=100r/s;
    limit_req_status 429;

    # --- Admin-plane gate -----------------------------------------------------
    # Branch (a): office CIDR allowlist (matches the true client after the
    # real_ip rewrite above). Branch (b): request came from a verified
    # cloudflared/VPC origin AND carries a CF-Connecting-IP header — allow only
    # together, so the tunnel header alone (spoofable) never opens the admin
    # surface open.
    geo $admin_allowed {
        default 0;
        include /etc/nginx/admin-whitelist.conf;   # e.g.  "203.0.113.0/24 1;"
    }
    geo $cf_origin_allowed {
        default 0;
        include /etc/nginx/cloudflared-ips.conf;   # cloudflared origin / VPC CIDR
    }
    map "$admin_allowed$cf_origin_allowed$http_cf_connecting_ip" $admin_gate {
        default 0;
        "1*"   1;    # office CIDR allowlist hit (any tunnel header state)
        "01*"  1;    # verified origin AND a real CF-Connecting-IP present
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream api_backend {
        server <BACKEND_UPSTREAM>;   # ALB DNS / Fargate service DNS:8080
        keepalive 32;
    }

    # Admin web dashboard (Next.js). Served on the isolated subdomain
    # admin.oddsmyanmar.online — see admin.oddsmyanmar.online.conf.
    upstream admin_web {
        server 127.0.0.1:3000;
        keepalive 16;
    }

    server {
        listen 80;
        server_name _;
        # Force HTTPS everywhere.
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;   # set to your domain(s)

        # TLS 1.3 preferred, 1.2 minimum. Certificates via ACM/Let's Encrypt.
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_certificate     /etc/nginx/tls/fullchain.pem;
        ssl_certificate_key /etc/nginx/tls/privkey.pem;

        # --- Security headers ---------------------------------------------------
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        # --- REST API proxy ------------------------------------------------------
        location /api/v1/auth/ {
            limit_req zone=auth_zone burst=20 nodelay;
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP          $remote_addr;
            proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto  $scheme;
        }

        # Admin control plane: office machines, or verified Tunnel/VPC origin.
        location /api/v1/admin/ {
            if ($admin_gate = 0) { return 403; }
            limit_req zone=api_zone burst=200;
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP          $remote_addr;
            proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto  $scheme;
        }

        # Agent dashboard API — also restricted (agents manage money).
        location /api/v1/agent/ {
            if ($admin_gate = 0) { return 403; }
            limit_req zone=api_zone burst=200;
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP          $remote_addr;
            proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto  $scheme;
        }

        # User-facing API — lightly rate limited.
        location /api/ {
            limit_req zone=api_zone burst=200;
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP          $remote_addr;
            proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto  $scheme;
        }

        # --- WebSocket (live odds / realtime pushes) ----------------------------
        location /ws {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host       $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # --- Static web front-end -------------------------------------------------
        location / {
            root   /usr/share/nginx/html;
            index  index.html;
            try_files $uri $uri/ /index.html;
        }

        client_max_body_size 4m;
    }
}