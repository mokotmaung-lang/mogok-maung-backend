name: Deploy Flutter App

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
  workflow_dispatch:

jobs:
  analyze-build:
    name: Analyze + Build APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build release APK
        run: flutter build apk --release

      # Signing credentials are supplied via GH secrets (keystore + JKS password).
      - name: Attach workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: mm-release.apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk