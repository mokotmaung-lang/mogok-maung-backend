# ==============================================================================
# api-admin-lockdown.conf — gateway-tier reverse-proxy block for the Go API
# control plane.
#
# Serves ONLY the money-movement API paths `/api/v1/admin/*` and
# `/api/v1/agent/*`. Access is restricted to the operator's static IP blocks at
# the edge; every other source (including Cloudflare edges that are not the
# whitelisted operator IPs) receives 403. Defence-in-depth with Cloudflare WAF
# (deploy/cloudflare/admin-ip-whitelist.sh) and the app-layer SUPER_ADMIN JWT.
#
# Generate with envsubst so real IPs stay out of git:
#
#   ADMIN_OFFICE_BLOCK=203.81.10.0/24 ADMIN_BACKUP_IP=111.84.3.200 \
#     API_BACKEND=api-internal:8080 \
#     envsubst '${ADMIN_OFFICE_BLOCK} ${ADMIN_BACKUP_IP} ${API_BACKEND}' \
#     < deploy/nginx/conf.d/api-admin-lockdown.conf \
#     > /etc/nginx/conf.d/api-admin-lockdown.conf
# ==============================================================================

# Dedicated control-plane listener (internal LB / dedicated ELB only).
server {
    listen 8443 ssl;
    server_name _;

    # --- Network-layer allow list (stricter than the WAF) -----------------
    allow ${ADMIN_OFFICE_BLOCK};   # corporate office static block
    allow ${ADMIN_BACKUP_IP};      # backup/DR operator IP
    deny  all;                     # blanket drop for everything else

    # --- Modern TLS: TLS 1.3 only (TLS_AES_256_GCM_SHA384 etc.) -----------
    ssl_protocols              TLSv1.3;
    ssl_ciphers                TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256;
    ssl_prefer_server_ciphers  on;
    ssl_session_cache          shared:AdminTLS:10m;
    ssl_session_timeout        10m;

    ssl_certificate     /etc/letsencrypt/live/myanmarbet.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/myanmarbet.com/privkey.pem;

    # --- Header hardening ----------------------------------------------------
    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    # Drop requests that bypassed Cloudflare: without CF-Connecting-IP the
    # client IP cannot be trusted, so refuse to proxy the control plane.
    if ($http_cf_connecting_ip = "") { return 403; }

    # Only control-plane routes exist on this listener.
    location ~ ^/api/v1/(admin|agent)/ {
        proxy_pass       http://${API_BACKEND};
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Never accept a client-supplied X-Forwarded-For; rebuild from the
        # Cloudflare-verified address only.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For   $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-MM-Admin-Gateway "locked-nginx";

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    # Nothing else is routable through this gateway.
    location / { return 403; }
}