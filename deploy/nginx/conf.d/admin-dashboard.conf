# ==============================================================================
# admin-dashboard.conf — reverse-proxy block for the System Admin portal.
# Access is locked to the operator's static office/backup IPs ONLY; everything
# else is denied at nginx (defence-in-depth under Cloudflare WAF).
#
# Generate the real config with envsubst so IPs stay secret (never in git):
#
#   ADMIN_OFFICE_IP=203.81.10.20 ADMIN_BACKUP_IP=111.84.3.200 \
#     envsubst '${ADMIN_OFFICE_IP} ${ADMIN_BACKUP_IP}' \
#     < deploy/nginx/conf.d/admin-dashboard.conf \
#     > /etc/nginx/conf.d/admin-dashboard.conf
#
# If the operator IPs move, update here + re-verify the allowed list, because
# "deny all" below locks EVERYONE (including Cloudflare) out of this block.
# ==============================================================================

server {
    listen 443 ssl;
    server_name myanmarbet.com;

    # --- Admin portal is allow-listed by operator static IP only -----------
    allow ${ADMIN_OFFICE_IP};   # ရုံးချုပ် static IP (mask-x in comments only)
    allow ${ADMIN_BACKUP_IP};   # backup connection static IP
    deny all;                   # literally everyone else, incl. Cloudflare

    ssl_certificate     /etc/letsencrypt/live/myanmarbet.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/myanmarbet.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://admin-dashboard-service:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Harden: no directory listing, no exposing Go API via this portal host.
    autoindex off;
    server_tokens off;
}

# -----------------------------------------------------------------------------
# If the admin portal is fronted by Kubernetes Ingress instead of this nginx,
# the equivalent is annotation-based IP whitelisting (same two IPs), e.g.:
#
#   nginx.ingress.kubernetes.io/whitelist-source-range: 203.81.10.20/32,111.84.3.200/32
#
# The backend additionally enforces a SECOND factor at the app layer: admin
# APIs already require SUPER_ADMIN JWT + password rotation (pwGuard).
# -----------------------------------------------------------------------------