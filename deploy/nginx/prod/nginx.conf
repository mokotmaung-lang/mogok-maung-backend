# ==============================================================================
# /etc/nginx/nginx.conf — Mogok Maung PRODUCTION edge gateway (Z.com VPS).
#
# http-level guardrails live HERE; the vhosts (server blocks) live in the
# Debian convention:
#   /etc/nginx/sites-available/mogok-maung  ->  /etc/nginx/sites-enabled/mogok-maung
#
# Required includes (copied from infrastructure/nginx/ by setup-ssl.sh):
#   /etc/nginx/cloudflare-ips.conf  (official ranges - never edit)
#   /etc/nginx/admin-whitelist.conf (HQ / agent-office CIDRs, e.g. "203.0.113.0/24 1;")
#   /etc/nginx/cloudflared-ips.conf (cloudflared/office server CIDR; empty = unused)
#
# Guardrail summary (do NOT regress):
#   1. Redis-key rate limiting on /api/v1/auth/* (10r/m, burst 20).
#   2. /api/v1/admin/* and /api/v1/agent/* reachable ONLY when $admin_gate = 1:
#        a. office CIDR in admin-whitelist.conf, OR
#        b. verified cloudflared/VPC origin (cloudflared-ips.conf) that ALSO
#           carries $http_cf_connecting_ip.
#   3. cloudflare-ips.conf MUST stay wired to set_real_ip_from.
#   4. TLS 1.2/1.3, HSTS, security headers, 4m body cap, server_tokens off,
#      limit_req_status 429.
# ==============================================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events { worker_connections 4096; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;
    server_tokens off;

    # --- Real client IP when behind Cloudflare ------------------------------
    include /etc/nginx/cloudflare-ips.conf;
    real_ip_header CF-Connecting-IP;

    # --- Rate limiting -------------------------------------------------------
    limit_req_zone $binary_remote_addr zone=auth_zone:10m   rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api_zone:10m    rate=100r/s;
    limit_req_status 429;

    # --- Admin-plane gate -----------------------------------------------------
    geo $admin_allowed {
        default 0;
        include /etc/nginx/admin-whitelist.conf;
    }
    geo $cf_origin_allowed {
        default 0;
        include /etc/nginx/cloudflared-ips.conf;
    }
    map "$admin_allowed$cf_origin_allowed$http_cf_connecting_ip" $admin_gate {
        default 0;
        "1*"   1;    # office CIDR allowlist hit (any tunnel header state)
        "01*"  1;    # verified origin AND a real CF-Connecting-IP present
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # --- Upstreams -------------------------------------------------------------
    upstream api_backend {
        server 127.0.0.1:8081;
        keepalive 32;
    }

    upstream admin_web {
        server 127.0.0.1:3000;
        keepalive 16;
    }

    # --- vhosts: Debian/Ubuntu sites-enabled -----------------------------------
    include /etc/nginx/conf.d/*.conf;
    include /etc/nginx/sites-enabled/*;
}